# SpectraRestore default training config
preset: default          # default | fast | tiny | large
data_root: data
out_dir: weights

iters: 200000
batch_size: 8
lr: 3.0e-4
min_lr: 1.0e-6
gt_crop: 256
degrade_aug_p: 0.3
ema_decay: 0.999

val_every: 2000
save_every: 5000
log_every: 100
seed: 42

loss:
  w_char: 1.0
  w_ssim: 0.2
  w_fft: 0.05
  w_lpips: 0.1
  lpips_warmup_frac: 0.2
